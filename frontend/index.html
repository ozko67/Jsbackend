
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Produtos - Integração Front & Back</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>📦 Catálogo de Produtos</h1>
      <p class="subtitulo">Demonstração de Integração: Frontend + Node.js Express + Supabase</p>
    </header>

    <!-- Formulário de Cadastro -->
    <section class="card">
      <h2>Cadastrar Novo Produto</h2>
      <form id="form-produto">
        <div class="campo">
          <label for="nome">Nome do Produto:</label>
          <input type="text" id="nome" placeholder="Ex: Teclado Mecânico" required>
        </div>

        <div class="campo">
          <label for="preco">Preço (R$):</label>
          <input type="number" id="preco" step="0.01" min="0" placeholder="Ex: 199.90" required>
        </div>

        <button type="submit" id="btn-cadastrar">Salvar Produto</button>
      </form>
    </section>

    <!-- Lista de Produtos -->
    <section class="card">
      <div class="card-header">
        <h2>Produtos Cadastrados</h2>
        <button id="btn-atualizar" class="btn-secundario" onclick="carregarProdutos()">🔄 Atualizar Lista</button>
      </div>

      <div id="status-conexao" class="status alerta">Conectando ao servidor...</div>

      <div id="lista-produtos" class="grid-produtos">
        <!-- Itens inseridos dinamicamente pelo JavaScript -->
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
